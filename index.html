<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Mar ❤️</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    #mensaje {
        position: fixed;
        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%) scale(0);

        color: #ff69b4;
        font-family: Arial, sans-serif;
        font-size: clamp(30px, 9vw, 60px);
        font-weight: bold;
        text-align: center;

        text-shadow:
            0 0 5px #ff69b4,
            0 0 15px #ff1493,
            0 0 30px #ff1493,
            0 0 60px #ff1493;

        opacity: 0;

        transition:
            transform 1s ease,
            opacity 1s ease;

        z-index: 10;
        white-space: nowrap;
    }

    #mensaje.mostrar {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }

    #instruccion {
        position: fixed;
        bottom: 25px;
        width: 100%;

        color: #888;
        font-family: Arial, sans-serif;
        text-align: center;
        font-size: 15px;

        z-index: 10;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="mensaje">
    TE AMO MAR ❤️
</div>

<div id="instruccion">
    Para vos, Mar ❤️
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const mensaje = document.getElementById("mensaje");
const instruccion = document.getElementById("instruccion");

let ancho;
let alto;

function ajustarCanvas() {

    const dpr = window.devicePixelRatio || 1;

    ancho = window.innerWidth;
    alto = window.innerHeight;

    canvas.width = ancho * dpr;
    canvas.height = alto * dpr;

    canvas.style.width = ancho + "px";
    canvas.style.height = alto + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

ajustarCanvas();

window.addEventListener("resize", ajustarCanvas);


// ==============================
// CREAR CORAZÓN
// ==============================

const particulas = [];

const cantidad = 500;

for (let i = 0; i < cantidad; i++) {

    const t = Math.random() * Math.PI * 2;

    // Fórmula matemática del corazón
    const hx = 16 * Math.pow(Math.sin(t), 3);

    const hy =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    // Hacer partículas también dentro del corazón
    const profundidad = Math.sqrt(Math.random());

    const x = hx * profundidad;
    const y = hy * profundidad;

    particulas.push({

        x: x,
        y: y,

        progreso: 0,

        velocidad:
            0.006 + Math.random() * 0.012,

        tamaño:
            1 + Math.random() * 2,

        brillo:
            Math.random() * Math.PI * 2
    });
}


// ==============================
// ANIMACIÓN
// ==============================

let tiempo = 0;
let terminado = false;

function animar() {

    ctx.clearRect(0, 0, ancho, alto);

    tiempo += 0.03;

    const centroX = ancho / 2;
    const centroY = alto / 2;

    // Escala adaptada al celular o PC
    const escala =
        Math.min(ancho, alto) * 0.025;


    let todosTerminados = true;


    for (const p of particulas) {

        if (p.progreso < 1) {

            p.progreso += p.velocidad;

            todosTerminados = false;
        }


        // Posición final
        const finalX =
            centroX + p.x * escala;

        const finalY =
            centroY - p.y * escala;


        // Posición inicial
        const inicioX =
            centroX;

        const inicioY =
            centroY;


        // Movimiento hacia el corazón
        const x =
            inicioX +
            (finalX - inicioX) * p.progreso;

        const y =
            inicioY +
            (finalY - inicioY) * p.progreso;


        // Brillo
        const brillo =
            0.7 +
            Math.sin(
                tiempo * 3 + p.brillo
            ) * 0.3;


        // Dibujar partícula
        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.tamaño,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            `rgba(255, ${80 + brillo * 100}, ${150 + brillo * 100}, ${brillo})`;


        ctx.shadowBlur = 12;

        ctx.shadowColor = "#ff1493";

        ctx.fill();

        ctx.shadowBlur = 0;
    }


    // Cuando termina el corazón
    if (todosTerminados && !terminado) {

        terminado = true;

        setTimeout(() => {

            mensaje.classList.add("mostrar");

            instruccion.style.opacity = "0";

        }, 700);
    }


    requestAnimationFrame(animar);
}


// Iniciar
animar();


// ==============================
// TOCAR / HACER CLICK
// ==============================

document.body.addEventListener("click", () => {

    mensaje.classList.add("mostrar");

    instruccion.style.opacity = "0";

});

</script>

</body>
</html>
