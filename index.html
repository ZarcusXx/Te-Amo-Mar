
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mar ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #mensaje {
            position: absolute;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%) scale(0);

            color: #ff69b4;
            font-family: Arial, sans-serif;
            font-size: clamp(28px, 8vw, 55px);
            font-weight: bold;

            text-align: center;
            white-space: nowrap;

            text-shadow:
                0 0 5px #ff69b4,
                0 0 15px #ff1493,
                0 0 30px #ff1493;

            opacity: 0;

            transition:
                transform 1s ease,
                opacity 1s ease;
        }

        #mensaje.mostrar {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        #instruccion {
            position: absolute;
            bottom: 25px;
            width: 100%;
            text-align: center;

            color: #777;
            font-family: Arial, sans-serif;
            font-size: 14px;

            transition: opacity 1s;
        }
    </style>
</head>

<div id="mensaje">
    TE AMO MAR ❤️
</div>
